<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Register | PixelRise Agency</title>

        <link rel="stylesheet" href="auth.css">
    </head>

    <body>
        <div class="container">
            <div class="card">
                <div class="brand-badge">✨ PixelRise</div>
                <h1>🚀 Create Account</h1>
                <p>💼 Book faster for digital vision or online presence</p>

                <form id="registerForm" novalidate>
                    <div class="input-group">
                        <label for="fullName">👤 Full Name</label>
                        <input id="fullName" type="text" name="fullName" placeholder="John Doe" required minlength="2">
                        <small class="error-message" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="registerEmail">📧 Email Address</label>
                        <input id="registerEmail" type="email" name="email" placeholder="you@example.com" required>
                        <small class="error-message" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="registerPassword">🔒 Password</label>
                        <div class="password-wrap">
                            <input id="registerPassword" type="password" name="password" placeholder="Create a strong password" required minlength="8">
                            <button type="button" class="toggle" aria-label="Toggle password visibility" onclick="toggleRegisterPassword()">👁️</button>
                        </div>
                        <small class="error-message" aria-live="polite"></small>
                    </div>

                    <div class="strength-wrap">
                        <div class="strength" aria-label="Password strength indicator">
                            <div id="strengthBar" class="strengthBar"></div>
                        </div>
                        <small id="strengthText" class="strength-text">Password strength: none</small>
                    </div>

                    <button type="submit" class="primary-btn">✅ Register</button>
                </form>

                <p class="button-text">
                    🔑 Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </div>

        <script src="auth.js"></script>
    </body>
</html>
